<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Aula 04 - Mídias em HTML</title>
</head>

<body>

    <table border="1" width="100%">

        <tr>
            <th colspan="4">
                Aula 04 - Mídias em HTML
            </th>
        </tr>

        <tr>

            <!-- IMAGENS -->
            <td>
                <h3>Imagens</h3>

                <img src="imagem1.jpg"
                     alt="Imagem 1"
                     width="150"
                     height="100">

                <br><br>

                <img src="imagem2.jpg"
                     alt="Imagem 2"
                     width="150"
                     height="100">

                <br><br>

                <img src="imagem3.jpg"
                     alt="Imagem 3"
                     width="150"
                     height="100">
            </td>

            <!-- VÍDEO -->
            <td>
                <h3>Vídeo</h3>

                <video controls
                       width="300"
                       poster="imagem1.jpg">

                    <source src="video.mp4" type="video/mp4">

                    Seu navegador não suporta vídeo.

                </video>
            </td>

            <!-- ÁUDIO -->
            <td>
                <h3>Áudio</h3>

                <audio controls>

                    <source src="musica.mp3" type="audio/mpeg">
                    <source src="musica.ogg" type="audio/ogg">

                    Seu navegador não suporta áudio.

                </audio>
            </td>

            <!-- FORMULÁRIO -->
            <td>
                <h3>Formulário</h3>

                <form>

                    <label for="nome">Nome:</label>
                    <br>
                    <input type="text" id="nome" name="nome" required>

                    <br><br>

                    <label for="email">E-mail:</label>
                    <br>
                    <input type="email" id="email" name="email" required>

                    <br><br>

                    <label for="mensagem">Mensagem:</label>
                    <br>
                    <textarea id="mensagem" name="mensagem"></textarea>

                    <br><br>

                    <button type="submit">Enviar</button>

                </form>
            </td>

        </tr>

        <tr>

            <!-- LINKS -->
            <td>
                <h3>Links</h3>

                <a href="https://www.google.com">
                    Google
                </a>

                <br><br>

                <a href="https://www.google.com">
                    <img src="imagem1.jpg"
                         alt="Google"
                         width="100">
                </a>

                <br><br>

                <a href="https://www.google.com" target="_blank">
                    Google - Nova aba
                </a>
            </td>

            <!-- LISTAS -->
            <td>
                <h3>Listas</h3>

                <!-- Lista ordenada -->
                <ol>
                    <li>Primeiro item</li>
                    <li>Segundo item</li>
                </ol>

                <!-- Lista não ordenada -->
                <ul>
                    <li>Item A</li>
                    <li>Item B</li>
                </ul>
            </td>

            <!-- TABELAS -->
            <td>
                <h3>Tabelas</h3>
            </td>

            <!-- IDENTIFICADORES -->
            <td>
                <h3>Identificadores e Classes</h3>
            </td>

        </tr>

        <tr>
            <td colspan="4">
                © Exemplo didático de HTML
            </td>
        </tr>

    </table>

</body>

</html>
